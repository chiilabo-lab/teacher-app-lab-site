<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おおきなかぶ ならべかえアプリ</title>
  <style>
    :root {
      --bg: #f7fbf2;
      --ink: #25312b;
      --muted: #617167;
      --leaf: #4f9d61;
      --soil: #8d6246;
      --sun: #ffd66b;
      --sky: #bde7ff;
      --line: #d4dfcf;
      --accent: #e45858;
      --ok: #2e8b57;
      --focus: #1c6dd0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--sky) 0 36%, var(--bg) 36% 100%);
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: clamp(14px, 3vw, 24px) clamp(14px, 4vw, 34px) 8px;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-button {
      min-height: 44px;
      border: 2px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 13px;
      font-weight: 800;
      box-shadow: 0 3px 0 #2d4638;
      cursor: pointer;
    }

    .tool-button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #2d4638;
    }

    .tool-button.primary {
      background: var(--sun);
    }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .stage {
      position: relative;
      min-height: 210px;
      overflow: hidden;
      border-bottom: 12px solid #6f4a35;
      background:
        radial-gradient(circle at 16% 12%, #fff8c7 0 44px, transparent 45px),
        linear-gradient(180deg, transparent 0 58%, #d9f0c9 58% 100%);
    }

    .ground {
      position: absolute;
      inset: auto 0 0;
      height: 54px;
      background: repeating-linear-gradient(90deg, #936449 0 28px, #87583f 28px 56px);
    }

    .turnip-wrap {
      position: absolute;
      left: clamp(10px, 4vw, 48px);
      bottom: 18px;
      width: clamp(136px, 22vw, 240px);
      height: clamp(136px, 22vw, 240px);
      transition: transform 500ms ease;
      cursor: pointer;
    }

    .turnip-wrap.wiggle {
      animation: kabu-wiggle 480ms ease-in-out;
    }

    @keyframes kabu-wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-5deg) translateX(-3px); }
      75% { transform: rotate(4deg) translateX(3px); }
    }

    .stage.popped .turnip-wrap {
      animation: pop-out 950ms cubic-bezier(0.25, 1.3, 0.4, 1) forwards;
    }

    @keyframes pop-out {
      0% { transform: translate(-16px, -18px) rotate(-8deg); }
      50% { transform: translate(26px, -84px) rotate(18deg); }
      74% { transform: translate(42px, -20px) rotate(12deg); }
      86% { transform: translate(46px, -34px) rotate(12deg); }
      100% { transform: translate(48px, -22px) rotate(12deg); }
    }

    .stage.popped .rope {
      animation: none;
      opacity: 0;
      transition: opacity 250ms ease;
    }

    .hole {
      position: absolute;
      left: calc(clamp(10px, 4vw, 48px) + clamp(30px, 5vw, 55px));
      bottom: 44px;
      width: clamp(64px, 11vw, 118px);
      height: 22px;
      border-radius: 50%;
      background: #4e3323;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 400ms ease 200ms;
    }

    .stage.popped .hole {
      opacity: 1;
    }

    .pullers {
      position: absolute;
      left: clamp(150px, 26vw, 280px);
      right: clamp(12px, 2vw, 30px);
      bottom: 42px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      z-index: 1;
      pointer-events: none;
    }

    .puller {
      transform-origin: center bottom;
      animation: tug-lean 560ms ease-in-out 3;
    }

    .puller svg {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes tug-lean {
      0%, 100% { transform: rotate(0); }
      45% { transform: rotate(-12deg) translateX(6px); }
    }

    .stage.popped .puller {
      animation: tumble 650ms ease-out forwards;
    }

    @keyframes tumble {
      0% { transform: rotate(0); }
      60% { transform: rotate(-22deg) translate(-10px, 2px); }
      100% { transform: rotate(-16deg) translate(-8px, 0); }
    }

    .pop-text {
      position: absolute;
      left: clamp(150px, 30vw, 320px);
      top: 14px;
      z-index: 4;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
      opacity: 0;
      transform: scale(0.4) rotate(-6deg);
      pointer-events: none;
    }

    .stage.popped .pop-text {
      animation: pop-text-in 620ms cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
    }

    @keyframes pop-text-in {
      to { opacity: 1; transform: scale(1) rotate(-6deg); }
    }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .confetti-piece {
      position: absolute;
      top: -18px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fall var(--dur, 1.6s) ease-in forwards;
    }

    @keyframes confetti-fall {
      0% { opacity: 1; transform: translateY(0) rotate(0); }
      100% { opacity: 0.5; transform: translateY(230px) rotate(var(--spin, 480deg)); }
    }

    .stage.celebrate .turnip-wrap {
      transform: translate(-16px, -18px) rotate(-8deg);
    }

    .rope {
      position: absolute;
      left: clamp(124px, 23vw, 250px);
      right: clamp(16px, 3vw, 34px);
      bottom: 86px;
      height: 7px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, #b58a54 0 14px, #d0aa6e 14px 28px);
      transform-origin: left center;
    }

    .stage.celebrate .rope {
      animation: tug 560ms ease-in-out 3;
    }

    @keyframes tug {
      0%, 100% { transform: translateX(0); }
      45% { transform: translateX(18px); }
    }

    .speech {
      position: absolute;
      z-index: 2;
      left: clamp(140px, 25vw, 270px);
      right: clamp(20px, 4vw, 50px);
      bottom: 102px;
      max-width: none;
      padding: 8px 16px;
      border: 3px solid #2d4638;
      border-radius: 8px;
      background: #fffdf3;
      font-size: clamp(19px, 3.2vw, 34px);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      opacity: 0.96;
      transform: translateY(0);
      transition: 260ms ease;
    }

    .stage.celebrate .speech {
      opacity: 1;
      background: #fff6c8;
      transform: translateY(-4px);
    }

    .work-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(6, minmax(112px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .slot {
      min-height: 174px;
      padding: 8px;
      border: 3px dashed #9bb49a;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
    }

    .slot-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-radius: 6px;
      background: #edf7e4;
      color: #2d4638;
      font-weight: 900;
      font-size: 15px;
    }

    .slot.over {
      border-color: var(--focus);
      background: #ecf5ff;
    }

    .card {
      width: 100%;
      min-width: 0;
      border: 3px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-rows: 94px auto;
      align-items: center;
      justify-items: center;
      gap: 4px;
      padding: 8px 6px 9px;
      box-shadow: 0 4px 0 #2d4638;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .card:focus-visible,
    .tool-button:focus-visible,
    .mini-button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }

    .card.selected {
      background: #fff6c8;
      transform: translateY(-3px);
    }

    .card.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .card.correct {
      border-color: var(--ok);
      background: #eefbf1;
    }

    .card.wrong {
      border-color: var(--accent);
      background: #fff0f0;
      animation: card-shake 420ms ease;
    }

    @keyframes card-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .card.correct {
      animation: card-hop 500ms ease;
    }

    @keyframes card-hop {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px) scale(0.85); }
      to { opacity: 1; transform: none; }
    }

    .card-name {
      font-weight: 900;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .card svg {
      width: 96px;
      height: 96px;
      display: block;
      overflow: visible;
      transform: scale(var(--char-scale, 1));
      transform-origin: center bottom;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 180px));
      gap: 8px;
      justify-content: center;
    }

    .mini-button {
      min-height: 42px;
      border: 2px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .message {
      min-height: 56px;
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: 8px;
      background: #fffdf3;
      border: 3px solid #e6d597;
      font-size: clamp(18px, 2.7vw, 28px);
      font-weight: 900;
      text-align: center;
    }

    footer {
      padding: 8px 12px 16px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .slots {
        grid-template-columns: repeat(3, minmax(104px, 1fr));
      }

      .speech {
        left: clamp(120px, 28vw, 210px);
        right: 12px;
        bottom: 103px;
      }
    }

    @media (max-width: 520px) {
      header {
        padding-top: 12px;
      }

      .toolbar {
        width: 100%;
      }

      .tool-button {
        flex: 1 1 130px;
      }

      .stage {
        min-height: 184px;
      }

      .slots {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .slot {
        min-height: 158px;
      }

      .card {
        grid-template-rows: 80px auto;
      }

      .card svg {
        width: 82px;
        height: 82px;
      }

      .turnip-wrap {
        width: 132px;
        height: 132px;
      }
    }
    .lab-site-bar {
      position: relative;
      z-index: 20;
      display: flex;
      min-height: 62px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px max(14px, calc((100% - 1180px) / 2));
      border-bottom: 1px solid #d7e8ee;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 18px rgba(48, 87, 104, 0.08);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    .lab-site-bar a {
      color: #257fa8;
      font-weight: 800;
      text-decoration: none;
    }

    .lab-site-bar__brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #213b47 !important;
    }

    .lab-site-bar__mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid #d7e8ee;
      border-radius: 50%;
      background: #e2f5fc;
    }

    .lab-site-bar__back {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      border: 1px solid #d7e8ee;
      border-radius: 999px;
      background: #fff;
    }

    @media (max-width: 520px) {
      .lab-site-bar {
        align-items: stretch;
        flex-direction: column;
        padding-block: 10px;
      }

      .lab-site-bar__back {
        width: 100%;
      }
    }
  </style>
</head>

    <a class="lab-site-bar__brand" href="../../index.html">

        <div>

        </div>
        <div class="toolbar" aria-label="そうさ">
          <button class="tool-button" id="shuffleButton" type="button">ばらばらにする</button>

          <button class="tool-button primary" id="checkButton" type="button">できたかな？</button>
        </div>
      </div>
    </header>

    <main>
      <section class="stage" id="stage" aria-label="おおきなかぶのばめん">
        <div class="speech" aria-hidden="true">うんとこしょ、<br>どっこいしょ。</div>
        <div class="rope" aria-hidden="true"></div>

          <svg viewBox="0 0 180 180" role="img" aria-label="おおきなかぶ">

        <div class="ground" aria-hidden="true"></div>
        <div class="hole" aria-hidden="true"></div>
        <div class="pullers" id="pullers" aria-hidden="true"></div>
        <div class="confetti" id="confettiLayer" aria-hidden="true"></div>
        <div class="pop-text" aria-hidden="true">すっぽーん！</div>
      </section>

      <section class="work-area" aria-label="ならべかえ">
        <div class="slots" id="slots"></div>
        <div class="controls" aria-label="えらんだカードをうごかす">
          <button class="mini-button" id="moveLeft" type="button">← ひだりへ</button>
          <button class="mini-button" id="moveRight" type="button">みぎへ →</button>
        </div>
      </section>

      <div class="message" id="message" role="status" aria-live="polite">カードをうごかして、じゅんばんをつくりましょう。</div>
    </main>

    <footer>おはなしのじゅんばんを、よくかんがえてならべましょう。</footer>
  </div>

    function playSfx(kind) {
      if (!canUseWebAudio) return;
      try {
        const context = getAudioContext();
        context.resume();
        const start = context.currentTime;
        const note = (freq, at, dur, options = {}) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = options.wave || "triangle";
          osc.frequency.setValueAtTime(freq, start + at);
          if (options.slide) {
            osc.frequency.exponentialRampToValueAtTime(options.slide, start + at + dur);
          }
          const successBoost = kind === "pop" || kind === "fanfare" ? 1.8 : 1;
          const peak = (options.gain || 0.15) * successBoost;
          gain.gain.setValueAtTime(0.0001, start + at);
          gain.gain.exponentialRampToValueAtTime(peak, start + at + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + at + dur);
          osc.connect(gain).connect(context.destination);
          osc.start(start + at);
          osc.stop(start + at + dur + 0.05);
        };
        if (kind === "select") {
          note(660, 0, 0.09, { slide: 990, gain: 0.1 });
        } else if (kind === "move") {
          note(480, 0, 0.07, { gain: 0.07 });
        } else if (kind === "wrong") {
          note(330, 0, 0.18, { wave: "sine", gain: 0.12 });
          note(262, 0.2, 0.26, { wave: "sine", gain: 0.12 });
        } else if (kind === "pop") {
          note(160, 0, 0.32, { slide: 880, gain: 0.22 });
        } else if (kind === "fanfare") {
          [523, 659, 784, 1047].forEach((freq, index) => {
            note(freq, 0.35 + index * 0.13, 0.26, { gain: 0.14 });
          });
          note(1319, 0.95, 0.5, { gain: 0.12 });
        }
      } catch (error) {
        // 効果音が出せない環境でも操作は続けられる
      }
    }

      card.innerHTML = `${item.kind === "person" ? personSvg(item) : animalSvg(item)}<span class="card-name">${item.name}</span>`;
      card.addEventListener("click", () => selectCard(item.id));
      card.addEventListener("dragstart", event => {
        draggedId = item.id;
        event.dataTransfer.setData("text/plain", item.id);
        event.dataTransfer.effectAllowed = "move";
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => {
        draggedId = null;
        card.classList.remove("dragging");
        document.querySelectorAll(".slot.over").forEach(slot => slot.classList.remove("over"));
      });
      return card;
    }

    function render() {
      slots.innerHTML = "";
      order.forEach((id, index) => {
        const item = people.find(entry => entry.id === id);
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.index = String(index);
        slot.innerHTML = `<div class="slot-label">${index + 1}ばん</div>`;
        const card = makeCard(item);
        if (selectedId === id) card.classList.add("selected");
        if (animateCards) {
          card.style.animation = `card-in 420ms ${index * 70}ms cubic-bezier(0.2, 1.4, 0.4, 1) both`;
        }
        slot.appendChild(card);
        slot.addEventListener("dragover", event => {
          event.preventDefault();
          slot.classList.add("over");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("over"));
        slot.addEventListener("drop", event => {
          event.preventDefault();
          slot.classList.remove("over");
          const movedId = event.dataTransfer.getData("text/plain") || draggedId;
          moveToIndex(movedId, index);
        });
        slots.appendChild(slot);
      });
      animateCards = false;
    }

    function selectCard(id) {
      selectedId = selectedId === id ? null : id;
      playSfx("select");
      clearResult();
      render();
    }

    function moveToIndex(id, targetIndex) {
      const from = order.indexOf(id);
      if (from === -1 || from === targetIndex) return;
      const next = [...order];
      next.splice(from, 1);
      next.splice(targetIndex, 0, id);
      order = next;
      selectedId = id;
      playSfx("move");
      clearResult();
      render();
    }

    function moveSelected(delta) {
      if (!selectedId) {
        message.textContent = "うごかしたいカードを、ひとつえらびましょう。";
        return;
      }
      const from = order.indexOf(selectedId);
      const to = Math.max(0, Math.min(order.length - 1, from + delta));
      moveToIndex(selectedId, to);
    }

    function getJapaneseVoices() {
      if (!canSpeak) return [];
      const voices = window.speechSynthesis.getVoices();
      const japaneseVoices = voices.filter(voice => voice.lang && voice.lang.toLowerCase().startsWith("ja"));
      return japaneseVoices.length ? japaneseVoices : voices;
    }

    function stopAllVoice() {
      voicePlaybackId += 1;
      activeCheerSources.forEach(source => {
        try {
          source.stop();
        } catch (error) {
          // The source may already have finished.
        }
      });
      activeCheerSources = [];
      activeCheerAudios.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
      activeCheerAudios = [];
      if (canSpeak) {
        window.speechSynthesis.cancel();
      }
    }

    function getAudioContext() {
      if (!activeAudioContext || activeAudioContext.state === "closed") {
        activeAudioContext = new AudioContextClass();
        cheerBuffersPromise = null;
      }
      return activeAudioContext;
    }

    function loadCheerBuffers(context) {
      if (!cheerBuffersPromise) {
        cheerBuffersPromise = Promise.all(cheerAudioSources.map(async source => {
          const response = await fetch(source);
          if (!response.ok) throw new Error(`音声を読み込めません: ${source}`);
          const data = await response.arrayBuffer();
          return context.decodeAudioData(data);
        }));
      }
      return cheerBuffersPromise;
    }

    function speakSyntheticChorus() {
      if (!canSpeak) {
        message.textContent = "このブラウザでは、こえを出せません。";
        return;
      }

      window.speechSynthesis.cancel();
      const voices = getJapaneseVoices();
      const chorus = [
        { delay: 0, pitch: 1, rate: 0.9, voiceIndex: 0 }
      ];

      chorus.forEach(part => {
        window.setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(cheerText);
          utterance.lang = "ja-JP";
          utterance.pitch = part.pitch;
          utterance.rate = part.rate;
          utterance.volume = 1;
          if (voices.length) {
            utterance.voice = voices[part.voiceIndex % voices.length];
          }
          window.speechSynthesis.speak(utterance);
        }, part.delay);
      });
    }

    function playRecordedChorus() {
      if (!canUseWebAudio && !canPlayRecordedVoice) return false;

      if (canUseWebAudio) {
        const playbackId = voicePlaybackId;
        const playWithWebAudio = async () => {
          const context = getAudioContext();
          await context.resume();
          const buffers = await loadCheerBuffers(context);
          if (playbackId !== voicePlaybackId) return;
          const now = context.currentTime + 0.04;
          // The embedded clips were identical. Play the levelled voice once to avoid
          // phase summing/clipping; keep its level through the whole phrase.
          const chorus = [
            { buffer: 0, delay: 0, rate: 1, gain: 1, pan: 0 }
          ];

          chorus.forEach(part => {
            const source = context.createBufferSource();
            const gainNode = context.createGain();
            const startAt = now + part.delay;
            source.buffer = buffers[part.buffer];
            source.playbackRate.setValueAtTime(part.rate, startAt);
            gainNode.gain.setValueAtTime(0.001, startAt);
            gainNode.gain.linearRampToValueAtTime(part.gain, startAt + 0.01);
            gainNode.gain.setValueAtTime(part.gain, startAt + Math.max(0.01, source.buffer.duration / part.rate - 0.02));
            gainNode.gain.linearRampToValueAtTime(0.001, startAt + source.buffer.duration / part.rate);

            source.connect(gainNode).connect(context.destination);

            source.start(startAt);
            activeCheerSources.push(source);
            source.onended = () => {
              activeCheerSources = activeCheerSources.filter(active => active !== source);
            };
          });
        };

        playWithWebAudio().catch(() => {
          if (playbackId !== voicePlaybackId) return;
          if (!playRecordedElements()) {
            speakSyntheticChorus();
          }
        });
        return true;
      }

      return playRecordedElements();
    }

    function playRecordedElements() {
      if (!canPlayRecordedVoice) return false;
      const chorus = [
        { source: cheerAudioSources[0], rate: 1, volume: 1 }
      ];
      let fallbackStarted = false;

      chorus.forEach((part, index) => {
        const audio = new Audio(part.source);
        if ("preservesPitch" in audio) audio.preservesPitch = false;
        if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = false;
        if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = false;
        audio.playbackRate = part.rate;
        audio.volume = part.volume;
        activeCheerAudios.push(audio);
        const playPromise = audio.play();
        if (playPromise) {
          playPromise.catch(() => {
            if (index === 0 && !fallbackStarted) {
              fallbackStarted = true;
              activeCheerAudios = [];
              speakSyntheticChorus();
            }
          });
        }
      });

      return true;
    }

    function speakTogether() {
      stopAllVoice();
      if (playRecordedChorus()) return;
      speakSyntheticChorus();
    }

    function speakTryAgain(score) {
      if (!canSpeak) return;
      stopAllVoice();
      const voices = getJapaneseVoices();
      const preferredVoice = voices
        .map(voice => {
          let score = 0;
          if (/haruka|nanami|kyoko|sayaka|ayumi|female/i.test(voice.name)) score += 4;
          if (voice.lang && voice.lang.toLowerCase().startsWith("ja")) score += 2;
          if (/ichiro|male|otoya/i.test(voice.name)) score -= 5;
          return { voice, score };
        })
        .sort((left, right) => right.score - left.score)[0]?.voice || voices[0];
      const utterance = new SpeechSynthesisUtterance(
        `ざんねんっ。${score}こ あっています。おはなしを、よく、よみましょう。`
      );
      utterance.lang = "ja-JP";
      utterance.pitch = 1.32;
      utterance.rate = 0.96;
      utterance.volume = 0.92;
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    function showPullers() {
      pullers.innerHTML = "";
      correctOrder.forEach((id, index) => {
        const item = people.find(entry => entry.id === id);
        const figure = document.createElement("div");
        figure.className = "puller";
        figure.style.width = `calc(clamp(38px, 6vw, 70px) * ${(0.72 + item.scale * 0.38).toFixed(2)})`;
        figure.style.animationDelay = `${index * 50}ms`;
        figure.innerHTML = item.kind === "person" ? personSvg(item) : animalSvg(item);
        pullers.appendChild(figure);
      });
    }

    function launchConfetti() {
      confettiLayer.innerHTML = "";
      const colors = ["#e45858", "#ffd66b", "#4f9d61", "#6ec6ff", "#b58cf0", "#ff9ecb"];
      for (let i = 0; i < 48; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--dur", `${(1 + Math.random() * 1.3).toFixed(2)}s`);
        piece.style.setProperty("--spin", `${Math.round(300 + Math.random() * 540)}deg`);
        piece.style.animationDelay = `${Math.round(Math.random() * 350)}ms`;
        confettiLayer.appendChild(piece);
      }
      celebrationTimers.push(window.setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 3400));
    }

    function stopCelebration() {
      celebrationTimers.forEach(window.clearTimeout);
      celebrationTimers = [];
      stage.classList.remove("celebrate", "popped");
      pullers.innerHTML = "";
      confettiLayer.innerHTML = "";
    }

    function clearResult() {
      stopCelebration();
      stopAllVoice();
      message.textContent = "カードをうごかして、じゅんばんをつくりましょう。";
      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("correct", "wrong");
      });
    }

    function checkAnswer() {
      if (stage.classList.contains("popped")) return;
      tries += 1;
      let score = 0;
      document.querySelectorAll(".card").forEach(card => {
        const slotIndex = Number(card.closest(".slot").dataset.index);
        const ok = card.dataset.id === correctOrder[slotIndex];
        card.style.animation = "";
        card.style.animationDelay = `${slotIndex * 70}ms`;
        card.classList.toggle("correct", ok);
        card.classList.toggle("wrong", !ok);
        if (ok) score += 1;
      });

      if (score === correctOrder.length) {
        stage.classList.add("celebrate");
        showPullers();
        message.textContent = "せいかい！ みんなで、うんとこしょ、どっこいしょ。";
        speakTogether();
        celebrationTimers.push(window.setTimeout(() => {
          stage.classList.add("popped");
          playSfx("pop");
          playSfx("fanfare");
          launchConfetti();
          message.textContent = tries === 1
            ? "すっぽーん！ かぶが　ぬけたよ！ いちどで　せいかい、すごい！"
            : "すっぽーん！ かぶが　ぬけたよ！ やったね！";
        }, 2000));
      } else {
        stage.classList.remove("celebrate");
        playSfx("wrong");
        message.textContent = `ざんねん！${score}こ あっています。おはなしを　よく　よみましょう！`;
        speakTryAgain(score);
      }
    }

    function shuffle() {
      const shuffled = [...correctOrder];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      order = shuffled;
      selectedId = null;
      tries = 0;
      animateCards = true;
      playSfx("select");
      clearResult();
      render();
    }

    document.getElementById("moveLeft").addEventListener("click", () => moveSelected(-1));
    document.getElementById("moveRight").addEventListener("click", () => moveSelected(1));
    document.getElementById("checkButton").addEventListener("click", checkAnswer);
    document.getElementById("shuffleButton").addEventListener("click", shuffle);
    voiceButton.addEventListener("click", speakTogether);
    turnipWrap.addEventListener("click", () => {
      if (stage.classList.contains("popped")) return;
      turnipWrap.classList.remove("wiggle");
      void turnipWrap.offsetWidth;
      turnipWrap.classList.add("wiggle");
      playSfx("wrong");
      message.textContent = "まだまだ　かぶは　ぬけません。じゅんばんが　できたら「できたかな？」をおしてね。";
    });
    if (!canPlayRecordedVoice && !canSpeak) {
      voiceButton.textContent = "こえなし";
      voiceButton.disabled = true;
      voiceButton.title = "このブラウザでは音声読み上げが使えません";
    }
    if (canSpeak) {
      window.speechSynthesis.onvoiceschanged = getJapaneseVoices;
    }

    slots.addEventListener("keydown", event => {
      if (!selectedId) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveSelected(-1);
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveSelected(1);
      }
    });

    render();
  </script>
</body>
</html>
