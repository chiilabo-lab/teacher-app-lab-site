<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おおきなかぶ ならべかえアプリ</title>
  <style>
    :root {
      --bg: #f7fbf2;
      --ink: #25312b;
      --muted: #617167;
      --leaf: #4f9d61;
      --soil: #8d6246;
      --sun: #ffd66b;
      --sky: #bde7ff;
      --line: #d4dfcf;
      --accent: #e45858;
      --ok: #2e8b57;
      --focus: #1c6dd0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--sky) 0 36%, var(--bg) 36% 100%);
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: clamp(14px, 3vw, 24px) clamp(14px, 4vw, 34px) 8px;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-button {
      min-height: 44px;
      border: 2px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 13px;
      font-weight: 800;
      box-shadow: 0 3px 0 #2d4638;
      cursor: pointer;
    }

    .tool-button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #2d4638;
    }

    .tool-button.primary {
      background: var(--sun);
    }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .stage {
      position: relative;
      min-height: 280px;
      overflow: hidden;
      border-bottom: 12px solid #6f4a35;
      background:
        radial-gradient(circle at 16% 12%, #fff8c7 0 44px, transparent 45px),
        linear-gradient(180deg, transparent 0 58%, #d9f0c9 58% 100%);
    }

    .ground {
      position: absolute;
      inset: auto 0 0;
      height: 54px;
      background: repeating-linear-gradient(90deg, #936449 0 28px, #87583f 28px 56px);
    }

    .turnip-wrap {
      position: absolute;
      left: clamp(10px, 4vw, 48px);
      bottom: 18px;
      width: clamp(136px, 22vw, 240px);
      height: clamp(136px, 22vw, 240px);
      transition: transform 500ms ease;
      cursor: pointer;
    }

    .turnip-wrap.wiggle {
      animation: kabu-wiggle 480ms ease-in-out;
    }

    @keyframes kabu-wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-5deg) translateX(-3px); }
      75% { transform: rotate(4deg) translateX(3px); }
    }

    .stage.popped .turnip-wrap {
      animation: pop-out 950ms cubic-bezier(0.25, 1.3, 0.4, 1) forwards;
    }

    @keyframes pop-out {
      0% { transform: translate(-16px, -18px) rotate(-8deg); }
      50% { transform: translate(26px, -84px) rotate(18deg); }
      74% { transform: translate(42px, -20px) rotate(12deg); }
      86% { transform: translate(46px, -34px) rotate(12deg); }
      100% { transform: translate(48px, -22px) rotate(12deg); }
    }

    .stage.popped .rope {
      animation: none;
      opacity: 0;
      transition: opacity 250ms ease;
    }

    .hole {
      position: absolute;
      left: calc(clamp(10px, 4vw, 48px) + clamp(30px, 5vw, 55px));
      bottom: 44px;
      width: clamp(64px, 11vw, 118px);
      height: 22px;
      border-radius: 50%;
      background: #4e3323;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 400ms ease 200ms;
    }

    .stage.popped .hole {
      opacity: 1;
    }

    .pullers {
      position: absolute;
      left: clamp(150px, 26vw, 280px);
      right: clamp(12px, 2vw, 30px);
      bottom: 42px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 3px;
      z-index: 1;
      pointer-events: none;
    }

    .puller {
      transform-origin: center bottom;
      min-width: 0;
      max-width: 94px;
      border-radius: 12px;
      transition: filter 150ms ease;
    }

    .puller.selected {
      outline: 3px solid #e28c23;
      background: #fff5bd;
    }

    .stage.celebrate .puller {
      animation: tug-lean 560ms ease-in-out 5;
    }

    @media (prefers-reduced-motion: reduce) {
      .stage .puller, .stage .rope, .stage .turnip-wrap { animation: none !important; }
    }

    .puller svg {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes tug-lean {
      0%, 100% { transform: rotate(0); }
      45% { transform: rotate(-12deg) translateX(6px); }
    }

    .stage.popped .puller {
      animation: tumble 650ms ease-out forwards;
    }

    @keyframes tumble {
      0% { transform: rotate(0); }
      60% { transform: rotate(-22deg) translate(-10px, 2px); }
      100% { transform: rotate(-16deg) translate(-8px, 0); }
    }

    .pop-text {
      position: absolute;
      left: clamp(150px, 30vw, 320px);
      top: 14px;
      z-index: 4;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
      opacity: 0;
      transform: scale(0.4) rotate(-6deg);
      pointer-events: none;
    }

    .stage.popped .pop-text {
      animation: pop-text-in 620ms cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
    }

    @keyframes pop-text-in {
      to { opacity: 1; transform: scale(1) rotate(-6deg); }
    }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .confetti-piece {
      position: absolute;
      top: -18px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fall var(--dur, 1.6s) ease-in forwards;
    }

    @keyframes confetti-fall {
      0% { opacity: 1; transform: translateY(0) rotate(0); }
      100% { opacity: 0.5; transform: translateY(230px) rotate(var(--spin, 480deg)); }
    }

    .stage.celebrate .turnip-wrap {
      transform: translate(-16px, -18px) rotate(-8deg);
    }

    .rope {
      position: absolute;
      left: clamp(124px, 23vw, 250px);
      right: clamp(16px, 3vw, 34px);
      bottom: 86px;
      height: 7px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, #b58a54 0 14px, #d0aa6e 14px 28px);
      transform-origin: left center;
    }

    .stage.celebrate .rope {
      animation: tug 560ms ease-in-out 5;
    }

    @keyframes tug {
      0%, 100% { transform: translateX(0); }
      45% { transform: translateX(18px); }
    }

    .speech {
      position: absolute;
      z-index: 2;
      left: clamp(140px, 25vw, 270px);
      right: clamp(20px, 4vw, 50px);
      top: 10px;
      bottom: auto;
      max-width: none;
      padding: 8px 16px;
      border: 3px solid #2d4638;
      border-radius: 8px;
      background: #fffdf3;
      font-size: clamp(19px, 3.2vw, 34px);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      opacity: 0.96;
      transform: translateY(0);
      transition: 260ms ease;
    }

    .stage.celebrate .speech {
      opacity: 1;
      background: #fff6c8;
      transform: translateY(-4px);
    }

    .stage.popped .speech {
      visibility: hidden;
      opacity: 0;
    }

    .work-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(6, minmax(112px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .slot {
      min-height: 174px;
      padding: 8px;
      border: 3px dashed #9bb49a;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
    }

    .slot-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-radius: 6px;
      background: #edf7e4;
      color: #2d4638;
      font-weight: 900;
      font-size: 15px;
    }

    .slot.over {
      border-color: var(--focus);
      background: #ecf5ff;
    }

    .card {
      width: 100%;
      min-width: 0;
      border: 3px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-rows: 94px auto;
      align-items: center;
      justify-items: center;
      gap: 4px;
      padding: 8px 6px 9px;
      box-shadow: 0 4px 0 #2d4638;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .card:focus-visible,
    .tool-button:focus-visible,
    .mini-button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }

    .card.selected {
      background: #fff6c8;
      transform: translateY(-3px);
    }

    .card.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .card.correct {
      border-color: var(--ok);
      background: #eefbf1;
    }

    .card.wrong {
      border-color: var(--accent);
      background: #fff0f0;
      animation: card-shake 420ms ease;
    }

    @keyframes card-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .card.correct {
      animation: card-hop 500ms ease;
    }

    @keyframes card-hop {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px) scale(0.85); }
      to { opacity: 1; transform: none; }
    }

    .card-name {
      font-weight: 900;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .card svg {
      width: 96px;
      height: 96px;
      display: block;
      overflow: visible;
      transform: scale(var(--char-scale, 1));
      transform-origin: center bottom;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 180px));
      gap: 8px;
      justify-content: center;
    }

    .mini-button {
      min-height: 42px;
      border: 2px solid #2d4638;
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .message {
      min-height: 56px;
      display: grid;
      place-items: center;
      padding: 10px;
      border-radius: 8px;
      background: #fffdf3;
      border: 3px solid #e6d597;
      font-size: clamp(18px, 2.7vw, 28px);
      font-weight: 900;
      text-align: center;
    }

    footer {
      padding: 8px 12px 16px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .slots {
        grid-template-columns: repeat(3, minmax(104px, 1fr));
      }

      .speech {
        left: clamp(120px, 28vw, 210px);
        right: 12px;
        bottom: 103px;
      }
    }

    @media (max-width: 520px) {
      header {
        padding-top: 12px;
      }

      .toolbar {
        width: 100%;
      }

      .tool-button {
        flex: 1 1 130px;
      }

      .stage {
        min-height: 230px;
      }

      .slots {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .slot {
        min-height: 158px;
      }

      .card {
        grid-template-rows: 80px auto;
      }

      .card svg {
        width: 82px;
        height: 82px;
      }

      .turnip-wrap {
        width: 104px;
        height: 104px;
        left: 3px;
      }
      .pullers { left: 100px; right: 8px; bottom: 42px; gap: 1px; }
      .rope { left: 90px; bottom: 61px; }
      .puller.selected { outline-width: 2px; }
      .speech { left: 105px; }
      .hole { left: 30px; width: 62px; }
    }
    .lab-site-bar {
      position: relative;
      z-index: 20;
      display: flex;
      min-height: 62px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px max(14px, calc((100% - 1180px) / 2));
      border-bottom: 1px solid #d7e8ee;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 18px rgba(48, 87, 104, 0.08);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    .lab-site-bar a {
      color: #257fa8;
      font-weight: 800;
      text-decoration: none;
    }

    .lab-site-bar__brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #213b47 !important;
    }

    .lab-site-bar__mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid #d7e8ee;
      border-radius: 50%;
      background: #e2f5fc;
    }

    .lab-site-bar__back {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      border: 1px solid #d7e8ee;
      border-radius: 999px;
      background: #fff;
    }

    @media (max-width: 520px) {
      .lab-site-bar {
        align-items: stretch;
        flex-direction: column;
        padding-block: 10px;
      }

      .lab-site-bar__back {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="lab-site-bar" aria-label="サイトへ戻る">
    <a class="lab-site-bar__brand" href="../../index.html">
      <span class="lab-site-bar__mark" aria-hidden="true">🐼</span>
      <span>先生のちいさなアプリ実験室</span>
    </a>
    <a class="lab-site-bar__back" href="../index.html">← アプリ一覧へ戻る</a>
  </nav>
  <div class="app">
    <header>
      <div class="title-row">
        <div>
          <h1>おおきなかぶ</h1>
          <p class="subtitle">かぶのとなりから、ひっぱるじゅんにならべよう。</p>
        </div>
        <div class="toolbar" aria-label="そうさ">
          <button class="tool-button" id="shuffleButton" type="button">ばらばらにする</button>
          <button class="tool-button" id="voiceButton" type="button">こえをきく</button>
          <button class="tool-button primary" id="checkButton" type="button">できたかな？</button>
        </div>
      </div>
    </header>

    <main>
      <section class="stage" id="stage" aria-label="おおきなかぶのばめん">
        <div class="speech" aria-hidden="true">うんとこしょ、<br>どっこいしょ。</div>
        <div class="rope" aria-hidden="true"></div>
        <div class="turnip-wrap" id="turnipWrap" aria-hidden="true">
          <svg viewBox="0 0 180 180" role="img" aria-label="おおきなかぶ">
            <path d="M82 50 C70 18 95 14 92 43 C111 14 136 20 108 52 C143 39 154 61 118 66" fill="#5fae63" stroke="#2d743d" stroke-width="5" stroke-linecap="round"/>
            <path d="M87 58 C113 56 138 77 135 112 C132 151 96 171 62 153 C28 135 29 85 59 67 C66 62 76 59 87 58Z" fill="#fbf4e6" stroke="#7f5a4b" stroke-width="5"/>
            <path d="M61 91 C76 84 99 84 118 95" fill="none" stroke="#dec7b3" stroke-width="5" stroke-linecap="round"/>
            <path d="M58 120 C75 131 101 133 121 120" fill="none" stroke="#dec7b3" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="ground" aria-hidden="true"></div>
        <div class="hole" aria-hidden="true"></div>
        <div class="pullers" id="pullers" aria-hidden="true"></div>
        <div class="confetti" id="confettiLayer" aria-hidden="true"></div>
        <div class="pop-text" aria-hidden="true">すっぽーん！</div>
      </section>

      <section class="work-area" aria-label="ならべかえ">
        <div class="slots" id="slots"></div>
        <div class="controls" aria-label="えらんだカードをうごかす">
          <button class="mini-button" id="moveLeft" type="button">← ひだりへ</button>
          <button class="mini-button" id="moveRight" type="button">みぎへ →</button>
        </div>
      </section>

      <div class="message" id="message" role="status" aria-live="polite">カードをうごかして、じゅんばんをつくりましょう。</div>
    </main>

    <footer>おはなしのじゅんばんを、よくかんがえてならべましょう。</footer>
  </div>

  <script>
    const correctOrder = ["grandpa", "grandma", "girl", "dog", "cat", "mouse"];
    const people = [
      { id: "grandpa", name: "おじいさん", kind: "person", role: "grandpa", color: "#b53b36", hair: "#f7f7f1", cheek: "#f2a7a0", scale: 1.08 },
      { id: "grandma", name: "おばあさん", kind: "person", role: "grandma", color: "#326f9f", hair: "#f7f7f1", cheek: "#f2a7a0", scale: 0.99 },
      { id: "girl", name: "まご", kind: "person", role: "girl", color: "#e64f62", hair: "#3b2b24", braids: true, cheek: "#f49aa8", scale: 0.9 },
      { id: "dog", name: "いぬ", kind: "animal", body: "#d99a5e", ear: "#8f5c35", cheek: "#f5b59a", scale: 0.82 },
      { id: "cat", name: "ねこ", kind: "animal", body: "#f2e6ca", ear: "#f0a6ad", cheek: "#f1aaa6", scale: 0.73 },
      { id: "mouse", name: "ねずみ", kind: "animal", body: "#a7adb4", ear: "#f3b8c3", cheek: "#f3aeb7", scale: 0.64 }

    let order = [...people].sort(() => Math.random() - 0.5).map(item => item.id);
    let selectedId = null;

    let tries = 0;
    let celebrationTimers = [];

    const slots = document.getElementById("slots");

    const stage = document.getElementById("stage");
    const voiceButton = document.getElementById("voiceButton");
    const pullers = document.getElementById("pullers");
    const confettiLayer = document.getElementById("confettiLayer");
    const turnipWrap = document.getElementById("turnipWrap");
    const cheerText = "うんとこしょ、どっこいしょ。";

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="
    ];
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const canUseWebAudio = Boolean(AudioContextClass && window.fetch);
    const canPlayRecordedVoice = Boolean(document.createElement("audio").canPlayType("audio/wav"));
    const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    let activeCheerAudios = [];
    let activeCheerSources = [];
    let voicePlaybackId = 0;
    let activeAudioContext = null;
    let cheerBuffersPromise = null;

    function playSfx(kind) {
      if (!canUseWebAudio) return;
      try {
        const context = getAudioContext();
        context.resume();
        const start = context.currentTime;
        const note = (freq, at, dur, options = {}) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = options.wave || "triangle";
          osc.frequency.setValueAtTime(freq, start + at);
          if (options.slide) {
            osc.frequency.exponentialRampToValueAtTime(options.slide, start + at + dur);
          }
          const successBoost = kind === "pop" || kind === "fanfare" ? 1.8 : 1;
          const peak = (options.gain || 0.15) * successBoost;
          gain.gain.setValueAtTime(0.0001, start + at);
          gain.gain.exponentialRampToValueAtTime(peak, start + at + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + at + dur);
          osc.connect(gain).connect(context.destination);
          osc.start(start + at);
          osc.stop(start + at + dur + 0.05);
        };
        if (kind === "select") {
          note(660, 0, 0.09, { slide: 990, gain: 0.1 });
        } else if (kind === "move") {
          note(480, 0, 0.07, { gain: 0.07 });
        } else if (kind === "wrong") {
          note(330, 0, 0.18, { wave: "sine", gain: 0.12 });
          note(262, 0.2, 0.26, { wave: "sine", gain: 0.12 });
        } else if (kind === "pop") {
          note(160, 0, 0.32, { slide: 880, gain: 0.22 });
        } else if (kind === "fanfare") {
          [523, 659, 784, 1047].forEach((freq, index) => {
            note(freq, 0.35 + index * 0.13, 0.26, { gain: 0.14 });
          });
          note(1319, 0.95, 0.5, { gain: 0.12 });
        }
      } catch (error) {
        // 効果音が出せない環境でも操作は続けられる
      }
    }

    function personSvg(item) {
      const braids = item.braids

      const headwear = {

          <path d="M35 26 Q50 12 65 26 Q59 21 50 21 Q41 21 35 26Z" fill="#f7f7f1" stroke="#263626" stroke-width="2"/>

          <path d="M30 35 Q50 25 70 35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>`,
        girl: `

          <path d="M34 29 L39 20 L44 29 L50 19 L56 29 L61 20 L66 29" fill="none" stroke="#f4d35e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
      }[item.role] || "";
      const bodyDecoration = item.role === "grandpa"
        ? `<path d="M34 69 H66 M38 77 H62" stroke="#f4d35e" stroke-width="4" stroke-linecap="round"/>`
        : item.role === "grandma"
          ? `<path d="M34 70 Q50 78 66 70 M35 78 Q50 86 65 78" stroke="#f4d35e" stroke-width="3" fill="none" stroke-linecap="round"/>`
          : `<path d="M35 68 H65 M38 76 H62" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><path d="M43 64 L50 72 L57 64" fill="none" stroke="#f4d35e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
      return `
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="89" rx="31" ry="8" fill="#dfe8d8"/>
          <path d="M19 90 C22 62 78 62 81 90 Z" fill="${item.color}" stroke="#2d4638" stroke-width="4"/>
          ${bodyDecoration}
          ${braids}
          <circle cx="50" cy="39" r="25" fill="#ffd9b9" stroke="#2d4638" stroke-width="4"/>
          <path d="M30 33 Q50 15 70 33 Q61 27 50 29 Q39 27 30 33Z" fill="${item.hair}" stroke="#2d4638" stroke-width="3"/>
          ${headwear}
          <circle cx="40" cy="42" r="5" fill="#25312b"/>
          <circle cx="60" cy="42" r="5" fill="#25312b"/>
          <circle cx="38" cy="40" r="1.8" fill="#ffffff"/>
          <circle cx="58" cy="40" r="1.8" fill="#ffffff"/>
          <circle cx="34" cy="51" r="4" fill="${item.cheek}"/>
          <circle cx="66" cy="51" r="4" fill="${item.cheek}"/>
          ${item.role === "grandpa"
            ? `<path d="M38 54 Q45 50 50 55 Q55 50 62 54" fill="none" stroke="#f7f7f1" stroke-width="6" stroke-linecap="round"/>
               <path d="M41 58 Q50 72 59 58 Q55 76 50 78 Q45 76 41 58Z" fill="#f7f7f1" stroke="#2d4638" stroke-width="3" stroke-linejoin="round"/>
               <path d="M43 56 Q50 61 57 56" fill="none" stroke="#25312b" stroke-width="2.5" stroke-linecap="round"/>`
            : `<path d="M41 56 Q50 63 59 56" fill="none" stroke="#25312b" stroke-width="3" stroke-linecap="round"/>`}
          <path d="M24 71 L9 82" stroke="#2d4638" stroke-width="5" stroke-linecap="round"/>
          <path d="M76 71 L91 82" stroke="#2d4638" stroke-width="5" stroke-linecap="round"/>

    function animalSvg(item) {
      const isCat = item.id === "cat";
      const isMouse = item.id === "mouse";
      const isDog = item.id === "dog";
      const tail = isMouse ? "M23 72 C4 68 3 48 21 47" : "M23 70 C7 72 7 46 28 48";
      const whiskers = isCat || isMouse
        ? `<path d="M49 48 H32 M49 53 H34 M51 48 H68 M51 53 H66" stroke="#25312b" stroke-width="2" stroke-linecap="round"/>`
        : "";
      const ears = isCat
        ? `<path d="M35 31 L27 12 L49 25 Z" fill="${item.ear}" stroke="#2d4638" stroke-width="4"/><path d="M65 31 L73 12 L51 25 Z" fill="${item.ear}" stroke="#2d4638" stroke-width="4"/>`
        : isDog
          ? `<ellipse cx="31" cy="34" rx="11" ry="18" fill="${item.ear}" stroke="#2d4638" stroke-width="4" transform="rotate(25 31 34)"/><ellipse cx="69" cy="34" rx="11" ry="18" fill="${item.ear}" stroke="#2d4638" stroke-width="4" transform="rotate(-25 69 34)"/>`
          : `<circle cx="34" cy="28" r="13" fill="${item.ear}" stroke="#2d4638" stroke-width="4"/><circle cx="66" cy="28" r="13" fill="${item.ear}" stroke="#2d4638" stroke-width="4"/>`;
      const spots = isDog ? `<circle cx="61" cy="35" r="9" fill="#8f5c35" opacity="0.65"/>` : "";
      return `
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="91" rx="31" ry="7" fill="#dfe8d8"/>
          <path d="${tail}" fill="none" stroke="#2d4638" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="50" cy="70" rx="32" ry="20" fill="${item.body}" stroke="#2d4638" stroke-width="4"/>
          ${ears}
          <circle cx="50" cy="43" r="25" fill="${item.body}" stroke="#2d4638" stroke-width="4"/>
          ${spots}
          <circle cx="41" cy="43" r="5" fill="#25312b"/>
          <circle cx="59" cy="43" r="5" fill="#25312b"/>
          <circle cx="39" cy="41" r="1.8" fill="#ffffff"/>
          <circle cx="57" cy="41" r="1.8" fill="#ffffff"/>
          <circle cx="34" cy="53" r="4" fill="${item.cheek}"/>
          <circle cx="66" cy="53" r="4" fill="${item.cheek}"/>
          <path d="M50 48 L45 54 H55 Z" fill="#25312b"/>
          <path d="M42 60 Q50 67 58 60" fill="none" stroke="#25312b" stroke-width="3" stroke-linecap="round"/>
          ${whiskers}
          <path d="M35 83 V91 M65 83 V91" stroke="#2d4638" stroke-width="5" stroke-linecap="round"/>
        </svg>`;

    function makeCard(item) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.draggable = true;
      card.dataset.id = item.id;
      card.style.setProperty("--char-scale", item.scale);
      card.setAttribute("aria-label", `${item.name}をえらぶ`);
      card.setAttribute("aria-pressed", String(selectedId === item.id));
      card.innerHTML = `${item.kind === "person" ? personSvg(item) : animalSvg(item)}<span class="card-name">${item.name}</span>`;
      card.addEventListener("click", () => selectCard(item.id));
      card.addEventListener("dragstart", event => {
        draggedId = item.id;
        event.dataTransfer.setData("text/plain", item.id);
        event.dataTransfer.effectAllowed = "move";
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => {
        draggedId = null;
        card.classList.remove("dragging");
        document.querySelectorAll(".slot.over").forEach(slot => slot.classList.remove("over"));
      });
      return card;
    }

    function render() {
      slots.innerHTML = "";
      order.forEach((id, index) => {
        const item = people.find(entry => entry.id === id);
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.index = String(index);
        slot.innerHTML = `<div class="slot-label">${index + 1}ばん</div>`;
        const card = makeCard(item);
        if (selectedId === id) card.classList.add("selected");
        if (animateCards) {
          card.style.animation = `card-in 420ms ${index * 70}ms cubic-bezier(0.2, 1.4, 0.4, 1) both`;
        }
        slot.appendChild(card);
        slot.addEventListener("dragover", event => {
          event.preventDefault();
          slot.classList.add("over");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("over"));
        slot.addEventListener("drop", event => {
          event.preventDefault();
          slot.classList.remove("over");
          const movedId = event.dataTransfer.getData("text/plain") || draggedId;
          moveToIndex(movedId, index);
        });
        slots.appendChild(slot);
      });
      showPullers();
      animateCards = false;
    }

    function selectCard(id) {
      selectedId = selectedId === id ? null : id;
      playSfx("select");
      clearResult();
      render();
    }

    function moveToIndex(id, targetIndex) {
      const from = order.indexOf(id);
      if (from === -1 || from === targetIndex) return;
      const next = [...order];
      next.splice(from, 1);
      next.splice(targetIndex, 0, id);
      order = next;
      selectedId = id;
      playSfx("move");
      clearResult();
      render();
    }

    function moveSelected(delta) {
      if (!selectedId) {
        message.textContent = "うごかしたいカードを、ひとつえらびましょう。";
        return;
      }
      const from = order.indexOf(selectedId);
      const to = Math.max(0, Math.min(order.length - 1, from + delta));
      moveToIndex(selectedId, to);
    }

    function getJapaneseVoices() {
      if (!canSpeak) return [];
      const voices = window.speechSynthesis.getVoices();
      const japaneseVoices = voices.filter(voice => voice.lang && voice.lang.toLowerCase().startsWith("ja"));
      return japaneseVoices.length ? japaneseVoices : voices;
    }

    function stopAllVoice() {
      voicePlaybackId += 1;
      activeCheerSources.forEach(source => {
        try {
          source.stop();
        } catch (error) {
          // The source may already have finished.
        }
      });
      activeCheerSources = [];
      activeCheerAudios.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
      activeCheerAudios = [];
      if (canSpeak) {
        window.speechSynthesis.cancel();
      }
    }

    function getAudioContext() {
      if (!activeAudioContext || activeAudioContext.state === "closed") {
        activeAudioContext = new AudioContextClass();
        cheerBuffersPromise = null;
      }
      return activeAudioContext;
    }

    function loadCheerBuffers(context) {
      if (!cheerBuffersPromise) {
        cheerBuffersPromise = Promise.all(cheerAudioSources.map(async source => {
          const response = await fetch(source);
          if (!response.ok) throw new Error(`音声を読み込めません: ${source}`);
          const data = await response.arrayBuffer();
          return context.decodeAudioData(data);
        }));
      }
      return cheerBuffersPromise;
    }

    function speakSyntheticChorus() {
      if (!canSpeak) {
        message.textContent = "このブラウザでは、こえを出せません。";
        return;
      }

      window.speechSynthesis.cancel();
      const voices = getJapaneseVoices();
      const chorus = [
        { delay: 0, pitch: 1, rate: 0.9, voiceIndex: 0 }
      ];

      chorus.forEach(part => {
        window.setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(cheerText);
          utterance.lang = "ja-JP";
          utterance.pitch = part.pitch;
          utterance.rate = part.rate;
          utterance.volume = 1;
          if (voices.length) {
            utterance.voice = voices[part.voiceIndex % voices.length];
          }
          window.speechSynthesis.speak(utterance);
        }, part.delay);
      });
    }

    function playRecordedChorus() {
      if (!canUseWebAudio && !canPlayRecordedVoice) return false;

      if (canUseWebAudio) {
        const playbackId = voicePlaybackId;
        const playWithWebAudio = async () => {
          const context = getAudioContext();
          await context.resume();
          const buffers = await loadCheerBuffers(context);
          if (playbackId !== voicePlaybackId) return;
          const now = context.currentTime + 0.04;
          // Six character-like parts are pre-mixed and peak-limited in this recording.
          // Play the mix once, at full level, for consistent mobile playback.
          const chorus = [
            { buffer: 0, delay: 0, rate: 1, gain: 1, pan: 0 }
          ];

          chorus.forEach(part => {
            const source = context.createBufferSource();
            const gainNode = context.createGain();
            const startAt = now + part.delay;
            source.buffer = buffers[part.buffer];
            source.playbackRate.setValueAtTime(part.rate, startAt);
            gainNode.gain.setValueAtTime(0.001, startAt);
            gainNode.gain.linearRampToValueAtTime(part.gain, startAt + 0.01);
            gainNode.gain.setValueAtTime(part.gain, startAt + Math.max(0.01, source.buffer.duration / part.rate - 0.02));
            gainNode.gain.linearRampToValueAtTime(0.001, startAt + source.buffer.duration / part.rate);

            source.connect(gainNode).connect(context.destination);

            source.start(startAt);
            activeCheerSources.push(source);
            source.onended = () => {
              activeCheerSources = activeCheerSources.filter(active => active !== source);
            };
          });
        };

        playWithWebAudio().catch(() => {
          if (playbackId !== voicePlaybackId) return;
          if (!playRecordedElements()) {
            speakSyntheticChorus();
          }
        });
        return true;
      }

      return playRecordedElements();
    }

    function playRecordedElements() {
      if (!canPlayRecordedVoice) return false;
      const chorus = [
        { source: cheerAudioSources[0], rate: 1, volume: 1 }
      ];
      let fallbackStarted = false;

      chorus.forEach((part, index) => {
        const audio = new Audio(part.source);
        if ("preservesPitch" in audio) audio.preservesPitch = false;
        if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = false;
        if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = false;
        audio.playbackRate = part.rate;
        audio.volume = part.volume;
        activeCheerAudios.push(audio);
        const playPromise = audio.play();
        if (playPromise) {
          playPromise.catch(() => {
            if (index === 0 && !fallbackStarted) {
              fallbackStarted = true;
              activeCheerAudios = [];
              speakSyntheticChorus();
            }
          });
        }
      });

      return true;
    }

    function speakTogether() {
      stopAllVoice();
      if (playRecordedChorus()) return;
      speakSyntheticChorus();
    }

    function speakTryAgain(score) {
      if (!canSpeak) return;
      stopAllVoice();
      const voices = getJapaneseVoices();
      const preferredVoice = voices
        .map(voice => {
          let score = 0;
          if (/haruka|nanami|kyoko|sayaka|ayumi|female/i.test(voice.name)) score += 4;
          if (voice.lang && voice.lang.toLowerCase().startsWith("ja")) score += 2;
          if (/ichiro|male|otoya/i.test(voice.name)) score -= 5;
          return { voice, score };
        })
        .sort((left, right) => right.score - left.score)[0]?.voice || voices[0];
      const utterance = new SpeechSynthesisUtterance(
        `ざんねんっ。${score}こ あっています。おはなしを、よく、よみましょう。`
      );
      utterance.lang = "ja-JP";
      utterance.pitch = 1.32;
      utterance.rate = 0.96;
      utterance.volume = 0.92;
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    function showPullers() {
      pullers.innerHTML = "";
      order.forEach((id, index) => {
        const item = people.find(entry => entry.id === id);
        const figure = document.createElement("div");
        figure.className = "puller" + (selectedId === id ? " selected" : "");
        figure.dataset.id = id;
        figure.style.flex = String(item.scale);
        figure.style.animationDelay = `${index * 50}ms`;
        figure.innerHTML = item.kind === "person" ? personSvg(item) : animalSvg(item);
        pullers.appendChild(figure);
      });
    }

    function launchConfetti() {
      confettiLayer.innerHTML = "";
      const colors = ["#e45858", "#ffd66b", "#4f9d61", "#6ec6ff", "#b58cf0", "#ff9ecb"];
      for (let i = 0; i < 48; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--dur", `${(1 + Math.random() * 1.3).toFixed(2)}s`);
        piece.style.setProperty("--spin", `${Math.round(300 + Math.random() * 540)}deg`);
        piece.style.animationDelay = `${Math.round(Math.random() * 350)}ms`;
        confettiLayer.appendChild(piece);
      }
      celebrationTimers.push(window.setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 3400));
    }

    function stopCelebration() {
      celebrationTimers.forEach(window.clearTimeout);
      celebrationTimers = [];
      stage.classList.remove("celebrate", "popped");
      showPullers();
      confettiLayer.innerHTML = "";
    }

    function clearResult() {
      stopCelebration();
      stopAllVoice();
      message.textContent = "カードをうごかして、じゅんばんをつくりましょう。";
      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("correct", "wrong");
      });
    }

    function checkAnswer() {
      if (stage.classList.contains("popped") || stage.classList.contains("celebrate")) return;
      tries += 1;
      let score = 0;
      document.querySelectorAll(".card").forEach(card => {
        const slotIndex = Number(card.closest(".slot").dataset.index);
        const ok = card.dataset.id === correctOrder[slotIndex];
        card.style.animation = "";
        card.style.animationDelay = `${slotIndex * 70}ms`;
        card.classList.toggle("correct", ok);
        card.classList.toggle("wrong", !ok);
        if (ok) score += 1;
      });

      if (score === correctOrder.length) {
        stage.classList.add("celebrate");
        showPullers();
        message.textContent = "せいかい！ みんなで、うんとこしょ、どっこいしょ。";
        speakTogether();
        celebrationTimers.push(window.setTimeout(() => {
          stage.classList.add("popped");
          playSfx("pop");
          playSfx("fanfare");
          launchConfetti();
          message.textContent = tries === 1
            ? "すっぽーん！ かぶが　ぬけたよ！ いちどで　せいかい、すごい！"
            : "すっぽーん！ かぶが　ぬけたよ！ やったね！";
        }, 3100));
      } else {
        stage.classList.remove("celebrate");
        playSfx("wrong");
        message.textContent = `ざんねん！${score}こ あっています。おはなしを　よく　よみましょう！`;
        speakTryAgain(score);
      }
    }

    function shuffle() {
      const shuffled = [...correctOrder];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      order = shuffled;
      selectedId = null;
      tries = 0;
      animateCards = true;
      playSfx("select");
      clearResult();
      render();
    }

    document.getElementById("moveLeft").addEventListener("click", () => moveSelected(-1));
    document.getElementById("moveRight").addEventListener("click", () => moveSelected(1));
    document.getElementById("checkButton").addEventListener("click", checkAnswer);
    document.getElementById("shuffleButton").addEventListener("click", shuffle);
    voiceButton.addEventListener("click", speakTogether);
    turnipWrap.addEventListener("click", () => {
      if (stage.classList.contains("popped")) return;
      turnipWrap.classList.remove("wiggle");
      void turnipWrap.offsetWidth;
      turnipWrap.classList.add("wiggle");
      playSfx("wrong");
      message.textContent = "まだまだ　かぶは　ぬけません。じゅんばんが　できたら「できたかな？」をおしてね。";
    });
    if (!canPlayRecordedVoice && !canSpeak) {
      voiceButton.textContent = "こえなし";
      voiceButton.disabled = true;
      voiceButton.title = "このブラウザでは音声読み上げが使えません";
    }
    if (canSpeak) {
      window.speechSynthesis.onvoiceschanged = getJapaneseVoices;
    }

    slots.addEventListener("keydown", event => {
      if (!selectedId) return;
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveSelected(-1);
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveSelected(1);
      }
    });

    render();
  </script>
</body>
</html>
